<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fb923c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdba74;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Hexagonal base structure -->
  <path d="M24 4 L38 13 L38 31 L24 40 L10 31 L10 13 Z" 
        stroke="url(#logoGradient)" 
        stroke-width="2" 
        fill="none"/>
  
  <!-- Central plus symbol -->
  <path d="M24 14 L24 30 M16 22 L32 22" 
        stroke="url(#logoGradient)" 
        stroke-width="3" 
        stroke-linecap="round"/>
  
  <!-- Molecular atoms (circles) -->
  <circle cx="24" cy="9" r="2.5" fill="url(#logoGradient)"/>
  <circle cx="36" cy="16" r="2.5" fill="url(#logoGradient)"/>
  <circle cx="36" cy="28" r="2.5" fill="url(#logoGradient)"/>
  <circle cx="24" cy="35" r="2.5" fill="url(#logoGradient)"/>
  <circle cx="12" cy="28" r="2.5" fill="url(#logoGradient)"/>
  <circle cx="12" cy="16" r="2.5" fill="url(#logoGradient)"/>
  
  <!-- Connecting bonds -->
  <line x1="24" y1="11" x2="24" y2="14" stroke="url(#logoGradient)" stroke-width="1.5"/>
  <line x1="34" y1="17" x2="32" y2="20" stroke="url(#logoGradient)" stroke-width="1.5"/>
  <line x1="34" y1="27" x2="32" y2="24" stroke="url(#logoGradient)" stroke-width="1.5"/>
  <line x1="24" y1="33" x2="24" y2="30" stroke="url(#logoGradient)" stroke-width="1.5"/>
  <line x1="14" y1="27" x2="16" y2="24" stroke="url(#logoGradient)" stroke-width="1.5"/>
  <line x1="14" y1="17" x2="16" y2="20" stroke="url(#logoGradient)" stroke-width="1.5"/>
</svg>
